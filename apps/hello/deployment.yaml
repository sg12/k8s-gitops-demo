apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
      - name: hello
        image: traefik/whoami:v1.11
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /health
            port: 80
